
model_params:
    sh_degree: 2
    flow_loss_type: 'warp'
    flow_batch: 16
    flow_scale: 0.8
    update_mask: "viewspace_diff"
    update_loss: "mse"
    gaussian_update_thresh: 1.0e-3  #1.0e-3 
    pixel_update_thresh: 0.001 #0.001
    dynamic_update_thresh: 0.1
    dilate_size: 48
    depth_init: False #False
    depth_thresh: 0.1
    adaptive_render: True
    adaptive_update_period: 0.3
    max_frames: 300 #300
    seed: 0

    gate_temp: 0.3
    gate_gamma: -0.5
    gate_eta: 1.01
    gate_lr: 0.1
    gate_lambda_l2: 0.0
    gate_lambda_l0: 0.01

    lambda_depth: 0.0
    lambda_depthssim: 0.3
    depth_pix_range: 20
    depth_num_comp: 3
    depth_tolerance: 0.01
    depth_pair_int: 300
    depth_from_iter: 4000
    depth_until_iter: 10000

    lambda_depthOderLoss: 0.1

    flow_offset: 3 #3
    keyframe_offset_op: 1 #5 #3
    keyframe_offset_sam: 5 #5 #3

    # fill these in for your wandb logging
    # wandb_project: 
    # wandb_entity: 
    wandb_tags: 'default'
    use_wandb: False

    frz_xyz: "none" # ["none","st","all"]
    frz_f_dc: "none" #"none"  
    frz_f_rest: "none" #"none"  
    frz_sc: "none"  
    frz_rot: "none" 
    frz_op: "none"  
    frz_flow: "none"
    frz_motion_label: "none" #언제 뭐가 업데이트될지 모르니깐 None

quantize_params:
    xyz_quant_type: 'none'
    xyz_gate_params: 'on' #'on'

    f_rest_quant_type: 'sq'
    f_rest_latent_dim: 4
    f_rest_latent_scale_norm: 'none'
    f_rest_ldecode_matrix: 'learnable'
    f_rest_ldec_std: 1.0e-1

    f_dc_quant_type: 'sq_res'
    f_dc_latent_dim: 8
    f_dc_latent_scale_norm: 'none'
    f_dc_ldecode_matrix: 'learnable'
    f_dc_ldec_std: 1.0e-4

    rot_quant_type: 'sq_res'
    rot_latent_dim: 6
    rot_latent_scale_norm: 'none'
    rot_ldecode_matrix: 'learnable'
    rot_ldec_std: 1.0e-2

    op_quant_type: 'sq_res'
    op_latent_dim: 3
    op_latent_scale_norm: 'none'
    op_ldecode_matrix: 'dft'
    op_ldec_std: 1.0e-4

    motion_label_quant_type: 'sq_res'
    motion_label_latent_dim: 3
    motion_label_latent_scale_norm: 'none'
    motion_label_ldecode_matrix: 'dft'
    motion_label_ldec_std: 1.0e-4

    sc_quant_type: 'sq_res'
    sc_latent_dim: 8
    sc_latent_scale_norm: 'none'
    sc_ldecode_matrix: 'learnable'
    sc_ldec_std: 1.0e-3

opt_params_initial:
    # epochs: 500
    # opacity_reset_interval: 600
    # densify_until_epoch: 0.8
    # densify_grad_threshold: 0.0003
    # position_lr_max_steps: 12000
    # f_rest_ldecs_lr: 1.0e-3
    # f_rest_lr_scaling: 5.0
    # lambda_flow: 0.0
    # lambda_tv: 0.1

    densification_interval: 100
    scaling_lr: 0.003 #0.005
    opacity_lr: 0.025 #0.025
    features_rest_lr: 0.0025 #0.0025
    position_lr_max_steps: 30000 #30000
    opacity_reset_interval: 3000 #3000
    motion_label_from_iter: 7000
    motion_label_until_iter: 9000
    densify_until_iter: 10000


opt_params_rest:
    epochs_rest: 5 #5

    xyz_ldecs_lr_rest: 1.0e-3
    xyz_lr_scaling_rest: 10.0
    position_lr_init_rest: 0.0005
    
    f_dc_ldecs_lr_rest: 1.0e-3
    f_dc_lr_scaling_rest: 5.0
    features_dc_lr_rest: 0.0025

    rot_ldecs_lr_rest: 1.0e-3
    rot_lr_scaling_rest: 0.5
    rotation_lr_rest: 0.05

    op_ldecs_lr_rest: 1.0e-4
    op_lr_scaling_rest: 1.0

    motion_label_ldecs_lr_rest: 1.0e-4
    motion_label_lr_scaling_rest: 1.0

    sc_ldecs_lr_rest: 1.0e-4
    sc_lr_scaling_rest: 1.0
    scaling_lr_rest: 0.01

    lambda_flow_rest: 0.0
    lambda_tv_rest: 0.1

    densify_until_epoch_rest: 0.8
    densification_interval_rest: 1 #1 #2
    densify_grad_threshold_rest: 0.002 #0.00125
    calc_dense_stats_rest: 2 #4
    percent_dense_rest: 0.01
    min_opacity_rest: 0.01
    size_threshold_rest: 20